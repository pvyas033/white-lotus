<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        :root {
            /* Background and foreground colors */
            --background-color: #181818;   /* Dark black background */
            --foreground-color: #fff;      /* White foreground */

            /* Shades of gray */
            --dark-one: #333;
            --dark-two: #7a7a7a;
            --main-black: #181818;
            --light-one: #f9fafb;
            --light-two: #f6f7fb;
            --light-three: #f6f7fb;

            /* Hover colors */
            --hover-color: #162b64;        /* Dark blue hover */
            --hover-orange: #cfaa5a;       /* Dark orange hover */

            /* Font family */
            --ff-teko: "Teko", sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--foreground-color);
            font-family: var(--ff-teko);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-code {
            font-size: 6rem;
            line-height: 1;
            color: var(--light-one);
            z-index: 3;
            text-align: center;
        }

        .error-title {
            margin-top: 1rem;
            font-size: 2rem;
            color: var(--light-one);
            z-index: 3;
            text-align: center;
        }

        .redirect-link {
            margin-top: 2rem;
            font-size: 2rem;
            color: var(--light-one);
            z-index: 3;
            text-align: center;
        }

        .redirect-link a {
            color: green;
            text-decoration: none;
        }

        .redirect-link a:hover {
            color: pink;
        }

        .error-box {
            background-color: var(--main-black);
            padding: 2rem;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1 class="error-code">404</h1>
        <h1 class="error-title">Oops! The page you are looking for does not exist.</h1>
        <h1 class="redirect-link">Click <a href="/">here</a> to redirect to the home page.</h1>
    </div>
</body>
</html>
